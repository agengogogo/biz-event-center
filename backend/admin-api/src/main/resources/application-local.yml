# Local demo profile: run entirely on an embedded SQLite file with no external
# PostgreSQL, Redis or Kafka. Activate with --spring.profiles.active=local
# (or the scripts/run-local.* helper) and override the database path with the
# BEC_SQLITE_PATH environment variable when needed.
spring:
  datasource:
    url: jdbc:sqlite:${BEC_SQLITE_PATH:./data/eventcenter.db}?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      # SQLite allows a single writer; one pooled connection serializes the
      # outbox poller and web request threads and avoids SQLITE_BUSY snapshots.
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

event-center:
  local:
    outbox:
      poll-interval-ms: 500
      batch-size: 100
      max-attempts: 3
      backoff-millis: 1000
    idempotency:
      cleanup-interval-ms: 600000
