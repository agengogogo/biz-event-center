spring:
  application:
    name: biz-event-center
  datasource:
    url: jdbc:postgresql://localhost:5432/eventcenter
    username: eventcenter
    password: eventcenter
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: biz-event-center
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.park.eventcenter.*"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

event-center:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-32b}
    token-ttl: 8h
    users:
      - username: admin
        password: admin123
        park-id: PARK-A
        roles: [ADMIN]
      - username: ops
        password: ops123
        park-id: PARK-B
        roles: [OPERATOR]
